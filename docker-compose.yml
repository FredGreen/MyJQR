# 固定 compose 项目名：无论仓库放在哪个目录、目录叫什么名字，
# 所有资源（容器/网络/卷）都挂在 myjqr 项目下，与本机其他 Docker 部署互不干扰。
# 查看本项目全部容器：docker compose ps   /   一键停止：docker compose down
name: myjqr

# 专属桥接网络：服务间用服务名互访（api/worker 连 mysql:3306、redis:6379），
# 与其他项目的容器网络隔离。
networks:
  myjqr-net:
    name: myjqr-net

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: myjqr-nginx
    # 宿主机端口冲突时改 .env 里的 HTTP_PORT
    ports: ["${HTTP_PORT:-80}:80"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web/dist:/usr/share/nginx/web:ro
      - ./apps/admin/dist:/usr/share/nginx/admin:ro
    networks: [myjqr-net]
    depends_on: [api]

  api:
    build: ./backend
    container_name: myjqr-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 9000 --workers 2
    env_file: .env
    # environment 优先级高于 env_file：容器内强制走内部网络主机名，
    # 因此 .env 里的 MYSQL_DSN/REDIS_URL 可以放心写 localhost 给本机裸跑用。
    environment:
      MYSQL_DSN: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-myjqr_root}@mysql:3306/writing?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
    networks: [myjqr-net]
    depends_on: [mysql, redis]
    ports: ["127.0.0.1:${API_PORT:-9000}:9000"]

  worker:
    build: ./backend
    container_name: myjqr-worker
    command: arq app.tasks.worker.WorkerSettings
    env_file: .env
    environment:
      MYSQL_DSN: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-myjqr_root}@mysql:3306/writing?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
    networks: [myjqr-net]
    depends_on: [mysql, redis]

  mysql:
    image: mysql:8.0
    container_name: myjqr-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-myjqr_root}
      MYSQL_DATABASE: writing
    volumes: ["mysql_data:/var/lib/mysql"]
    # 本机 3306 已被原生 MySQL80 服务占用时，在 .env 里设 MYSQL_HOST_PORT=13306
    ports: ["127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"]
    networks: [myjqr-net]

  redis:
    image: redis:7-alpine
    container_name: myjqr-redis
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    networks: [myjqr-net]

  # —— M4 才用到，默认不启动：docker compose --profile milvus up -d ——
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: myjqr-etcd
    profiles: ["milvus"]
    networks: [myjqr-net]
    environment: { ETCD_AUTO_COMPACTION_MODE: revision, ETCD_AUTO_COMPACTION_RETENTION: "1000" }
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: myjqr-minio
    profiles: ["milvus"]
    networks: [myjqr-net]
    environment: { MINIO_ACCESS_KEY: minioadmin, MINIO_SECRET_KEY: minioadmin }
    command: minio server /minio_data
    volumes: ["minio_data:/minio_data"]

  milvus:
    image: milvusdb/milvus:v2.4.9
    container_name: myjqr-milvus
    profiles: ["milvus"]
    networks: [myjqr-net]
    command: ["milvus", "run", "standalone"]
    environment: { ETCD_ENDPOINTS: etcd:2379, MINIO_ADDRESS: minio:9000 }
    volumes: ["milvus_data:/var/lib/milvus"]
    ports: ["127.0.0.1:19530:19530"]
    depends_on: [etcd, minio]

volumes: { mysql_data: {}, redis_data: {}, minio_data: {}, milvus_data: {} }
